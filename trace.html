<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trace">
<meta name="theme-color" content="#111111">
<title>Trace</title>
<style>
  :root { --bg:#111; --panel:rgba(20,20,20,.82); --fg:#f4f1ea; --muted:#a9a49a; --accent:#f2b84b; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; overflow:hidden;
    overscroll-behavior:none; -webkit-user-select:none; user-select:none; }
  #stage { position:fixed; inset:0; touch-action:none; overflow:hidden; }
  #cam { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; background:#000; }
  #overlay { position:absolute; left:50%; top:50%; width:80vw; max-width:none; pointer-events:none;
    transform-origin:center center; opacity:.5; display:none; }
  button { font:inherit; color:var(--fg); background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.18);
    border-radius:12px; padding:10px 12px; min-height:44px; cursor:pointer; }
  button.on { background:var(--accent); color:#1a1a1a; border-color:var(--accent); }
  button.primary { background:var(--accent); color:#1a1a1a; border:0; font-weight:600; padding:14px 22px; font-size:17px; }
  #bar { position:fixed; left:0; right:0; bottom:0; padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    background:var(--panel); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); display:none; }
  .row { display:flex; gap:8px; align-items:center; }
  .row + .row { margin-top:8px; }
  .row.wrap { flex-wrap:wrap; }
  .row label { font-size:13px; color:var(--muted); min-width:56px; }
  input[type=range] { flex:1; accent-color:var(--accent); height:32px; }
  #more { display:none; }
  #more.open { display:block; }
  #hint { position:fixed; top:calc(10px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
    background:var(--panel); padding:8px 14px; border-radius:999px; font-size:13px; color:var(--fg);
    transition:opacity .4s; pointer-events:none; white-space:nowrap; display:none; }
  #lockBadge { position:fixed; top:calc(10px + env(safe-area-inset-top)); right:12px; background:var(--accent);
    color:#1a1a1a; font-size:12px; font-weight:600; padding:5px 10px; border-radius:999px; display:none; }
  #start { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px; padding:28px; text-align:center; background:var(--bg); }
  #start h1 { margin:0; font-size:30px; letter-spacing:.5px; }
  #start p { margin:0; color:var(--muted); line-height:1.5; max-width:340px; }
  #err { color:#ff8f7a; font-size:14px; max-width:340px; line-height:1.5; }
  input[type=file] { display:none; }
</style>
</head>
<body>
<div id="stage">
  <video id="cam" playsinline muted autoplay></video>
  <img id="overlay" alt="">
</div>

<div id="hint">Drag to move · pinch to resize &amp; rotate</div>
<div id="lockBadge">LOCKED</div>

<div id="bar">
  <div class="row">
    <label for="opacity">Fade</label>
    <input id="opacity" type="range" min="0" max="100" value="50">
  </div>
  <div class="row">
    <button id="pick">Picture</button>
    <button id="lock" style="flex:1">Lock image</button>
    <button id="moreBtn">More</button>
  </div>
  <div id="more">
    <div class="row">
      <label for="size">Size</label>
      <input id="size" type="range" min="10" max="400" value="100">
    </div>
    <div class="row">
      <label for="rot">Rotate</label>
      <input id="rot" type="range" min="-180" max="180" value="0">
    </div>
    <div class="row wrap">
      <button id="fNormal" class="on">Colour</button>
      <button id="fBW">B&amp;W</button>
      <button id="fContrast">Bold lines</button>
      <button id="flip">Mirror</button>
      <button id="reset">Reset</button>
    </div>
  </div>
</div>

<div id="start">
  <h1>Trace</h1>
  <p>Pick a picture, point your phone at the paper, and trace the see-through image. Propping the phone on a glass or stand works best.</p>
  <button class="primary" id="go">Choose picture &amp; start</button>
  <div id="err"></div>
</div>

<input id="file" type="file" accept="image/*">

<script>
(() => {
  const $ = id => document.getElementById(id);
  const cam = $('cam'), img = $('overlay'), stage = $('stage');
  const st = { x:0, y:0, s:1, r:0, flip:false, locked:false };
  let started = false, wakeLock = null;

  function apply() {
    img.style.transform =
      `translate(-50%,-50%) translate(${st.x}px,${st.y}px) rotate(${st.r}deg) scale(${st.flip ? -st.s : st.s}, ${st.s})`;
    $('size').value = Math.round(st.s * 100);
    $('rot').value = Math.round(((st.r + 540) % 360) - 180);
  }

  // ---------- camera ----------
  async function startCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error('This browser can’t use the camera here. Open the page over https (a proper web link), in Safari or Chrome.');
    }
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });
    cam.srcObject = stream;
    await cam.play().catch(() => {});
  }

  async function keepAwake() {
    try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && started) keepAwake();
  });

  // ---------- picture ----------
  function loadFile(f) {
    if (!f) return;
    const url = URL.createObjectURL(f);
    img.onload = () => { img.style.display = 'block'; resetView(); showHint(); };
    img.src = url;
  }

  $('go').onclick = () => $('file').click();
  $('pick').onclick = () => $('file').click();
  $('file').onchange = async e => {
    const f = e.target.files[0];
    e.target.value = '';
    if (!f) return;
    loadFile(f);
    if (!started) {
      try {
        await startCamera();
        started = true;
        $('start').style.display = 'none';
        $('bar').style.display = 'block';
        keepAwake();
      } catch (err) {
        $('err').textContent = (err && err.name === 'NotAllowedError')
          ? 'Camera permission was blocked. Allow camera access for this site in your browser settings, then try again.'
          : (err.message || 'Couldn’t start the camera.');
      }
    }
  };

  // ---------- controls ----------
  $('opacity').oninput = e => img.style.opacity = e.target.value / 100;
  $('size').oninput = e => { st.s = e.target.value / 100; apply(); };
  $('rot').oninput = e => { st.r = +e.target.value; apply(); };
  $('moreBtn').onclick = () => {
    const o = $('more').classList.toggle('open');
    $('moreBtn').classList.toggle('on', o);
  };
  $('lock').onclick = () => {
    st.locked = !st.locked;
    $('lock').classList.toggle('on', st.locked);
    $('lock').textContent = st.locked ? 'Unlock image' : 'Lock image';
    $('lockBadge').style.display = st.locked ? 'block' : 'none';
    $('size').disabled = $('rot').disabled = st.locked;
  };
  $('flip').onclick = () => { st.flip = !st.flip; $('flip').classList.toggle('on', st.flip); apply(); };
  $('reset').onclick = () => { if (!st.locked) resetView(); };

  const filters = { fNormal:'none', fBW:'grayscale(1)', fContrast:'grayscale(1) contrast(2.2) brightness(1.1)' };
  Object.keys(filters).forEach(id => {
    $(id).onclick = () => {
      img.style.filter = filters[id];
      Object.keys(filters).forEach(k => $(k).classList.toggle('on', k === id));
    };
  });

  function resetView() { st.x = 0; st.y = -40; st.s = 1; st.r = 0; apply(); }

  let hintTimer;
  function showHint() {
    const h = $('hint');
    h.style.display = 'block'; h.style.opacity = 1;
    clearTimeout(hintTimer);
    hintTimer = setTimeout(() => { h.style.opacity = 0; setTimeout(() => h.style.display = 'none', 400); }, 3500);
  }

  // ---------- gestures: 1 finger move, 2 fingers pinch + rotate ----------
  const pts = new Map();
  let prev = null;

  function snapshot() {
    const p = [...pts.values()];
    if (p.length === 1) return { n:1, cx:p[0].x, cy:p[0].y };
    const [a, b] = p;
    return { n:2, cx:(a.x + b.x) / 2, cy:(a.y + b.y) / 2,
             d:Math.hypot(b.x - a.x, b.y - a.y), ang:Math.atan2(b.y - a.y, b.x - a.x) };
  }

  stage.addEventListener('pointerdown', e => {
    if (st.locked || !started) return;
    stage.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, { x:e.clientX, y:e.clientY });
    if (pts.size <= 2) prev = snapshot();
  });
  stage.addEventListener('pointermove', e => {
    if (st.locked || !pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x:e.clientX, y:e.clientY });
    if (pts.size > 2) return;
    const cur = snapshot();
    if (prev && prev.n === cur.n) {
      st.x += cur.cx - prev.cx;
      st.y += cur.cy - prev.cy;
      if (cur.n === 2 && prev.d > 0) {
        st.s = Math.min(6, Math.max(0.05, st.s * cur.d / prev.d));
        st.r += (cur.ang - prev.ang) * 180 / Math.PI;
      }
      apply();
    }
    prev = cur;
  });
  const up = e => { pts.delete(e.pointerId); prev = pts.size ? snapshot() : null; };
  stage.addEventListener('pointerup', up);
  stage.addEventListener('pointercancel', up);

  // stop iOS page zoom / bounce
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('dblclick', e => e.preventDefault());
})();
</script>
</body>
</html>
